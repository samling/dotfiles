id           = "sboynton/stock-ticker"
name         = "Stock Ticker"
version      = "0.2.0"
plugin_api   = 24
author       = "sboynton"
license      = "MIT"
icon         = "chart-line"
description  = "A compact single-stock quote for the Noctalia bar."
tags         = ["bar", "finance", "stocks"]
dependencies = ["xdg-open"]

[[setting]]
key             = "symbol"
type            = "string"
label_key       = "settings.symbol.label"
description_key = "settings.symbol.description"
default         = "NVDA"

[[setting]]
key             = "api_key"
type            = "string"
label_key       = "settings.api_key.label"
description_key = "settings.api_key.description"
default         = ""

[[setting]]
key             = "refresh_interval_minutes"
type            = "int"
label_key       = "settings.refresh_interval_minutes.label"
description_key = "settings.refresh_interval_minutes.description"
default         = 5
min             = 1
max             = 1440

[[service]]
id    = "quotes"
entry = "service.luau"

[[widget]]
id    = "ticker"
entry = "widget.luau"

  [widget.actions]
  left = "panel-toggle sboynton/stock-ticker:menu"
  right = "plugin sboynton/stock-ticker:quotes all open"

[[panel]]
id              = "menu"
entry           = "panel.luau"
width           = 200
height          = 70
placement       = "attached"
open_near_click = true
