# Match the Ghostty configuration; requires Foot 1.28+ for blur.
font=IosevkaTerm Nerd Font Propo:size=10.5
pad=5x0 center

[scrollback]
# Foot counts lines, while Ghostty's 10000000 limit counts bytes.
lines=10000

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes

[csd]
preferred=none

[colors-dark]
alpha=0.9
# Like Ghostty's background-opacity-cells=false, keep explicit cell colors opaque.
alpha-mode=default
blur=yes

# Catppuccin Mocha palette, selection, and cursor from Ghostty's theme.
# Ghostty's empty `background =` resets the theme background to this default.
background=282c34
foreground=cdd6f4
cursor=1e1e2e f5e0dc
selection-background=353749
selection-foreground=cdd6f4

regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de

bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6adc8
