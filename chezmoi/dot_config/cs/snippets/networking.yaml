# Kubernetes-specific command snippets
snippets:
  netstat-find-process-by-port:
    id: "netstat-find-process-by-port"
    name: "netstat-find-process-by-port"
    description: "Find process by port number"
    command: "sudo netstat -tulpn ${port_number}"
    variables:
      - name: "port_number"
        description: "Port (e.g., 8080)"
        required: true
        type: "port"
    tags: ["networking", "netstat"]
    created_at: "2025-01-01T00:00:00Z"
    updated_at: "2025-01-01T00:00:00Z"

  ssh-tunnel-35923:
    id: "ssh-tunnel-35923"
    name: "ssh-tunnel-35923"
    description: "Forward local port 35923 to port 35923 on 192.168.86.210 over SSH"
    command: "ssh -N -L 127.0.0.1:35923:127.0.0.1:35923 sboynton@192.168.86.210"
    tags: ["networking", "ssh", "tunnel"]
    created_at: "2026-09-30T16:36:10Z"
    updated_at: "2026-09-30T16:36:10Z"
