"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
${custom.kube_pane}\
$line_break\
$python\
$character"""

[directory]
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []

[custom.kube_pane]
command = '''
pane_context=$(command kubectl config current-context 2>/dev/null) || exit 1
global_context=$(KUBECONFIG="$KUBECONFIG_GLOBAL" command kubectl config current-context 2>/dev/null)
[ -n "$pane_context" ] && [ "$pane_context" != "$global_context" ] || exit 1
printf ' ⎈ %s' "$pane_context"
'''
when = true
format = "[$output]($style)"
style = "bold yellow"
shell = ["bash", "--noprofile", "--norc"]
